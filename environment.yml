      #   efficientvit's TFLite export path, which we don't use; we deploy via ONNX QDQ +
      #   TensorRT). Careful: TinyNeuralNetwork/requirements.txt pins `numpy<2`, so installing
      #   efficientvit quietly downgrades numpy and breaks terratorch (needs numpy>=2.2) and
      #   opencv-python-headless (needs numpy>=2). pip only warns, the install doesn't fail.
      #   Restore numpy afterwards: pip install "numpy==2.2.6"  (see README.md Install section).
