# conda env for the Jetson Xavier NX (JetPack 5.0.2, L4T R35.1, CUDA 11.4, TRT 8.4.1)
#   conda env create -f env.yaml
# then build pycuda + rasterio (see README, they have no aarch64 wheels).
# tensorrt is not installed here - it comes from JetPack via
#   export PYTHONPATH=/usr/lib/python3.8/dist-packages:$PYTHONPATH
name: flood
channels:
  - conda-forge
dependencies:
  - python=3.8.20
  - pip=24.3.1
  - setuptools=75.3.0
  - wheel=0.45.1
  - pip:
      # NVIDIA build of torch for JetPack 5.0.2 (CUDA 11.4)
      - https://developer.download.nvidia.com/compute/redist/jp/v502/pytorch/torch-1.13.0a0%2Bd0d6b1f2.nv22.10-cp38-cp38-linux_aarch64.whl
      - numpy==1.24.4
      - onnx==1.17.0
      - onnxruntime==1.19.2
      - protobuf==5.29.6
      - albumentations==1.4.18
      - albucore==0.0.17
      - opencv-python-headless==4.13.0.92
      - scipy==1.10.1
      - scikit-image==0.21.0
      - matplotlib==3.7.5
      - pandas==2.0.3
      - pillow==10.4.0
      - pyyaml==6.0.3
      - pytools==2024.1.14
      - mako==1.3.10
      - platformdirs==4.3.6
      - affine==2.4.0
      - attrs==25.3.0
      - click==8.1.8
      - click-plugins==1.1.1.2
      - cligj==0.7.2
      - snuggs==1.4.7
      - certifi==2026.2.25
      - gsutil
